name: iPhone Native
on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Validate affected changes without building an IPA; disable only for the consolidated final delivery"
        type: boolean
        default: true
      run_live_integration:
        description: "Test the native services and UI with real public addons"
        type: boolean
        default: false
      validation_scope:
        description: "Full suite, browser/palette regressions, or preserved exact-source validation"
        type: choice
        options:
          [
            full,
            affected,
            sources-search-subtitles,
            mobile-sources-subtitles,
            stable-mobile,
            reading-intro,
            reading-followup,
            reading-final,
            reading-tablet-final,
            continuation-parity,
            language-reference,
            system-maintenance,
            navigation-sync,
            onboarding-desktop,
            service-browser,
            streaming-sync,
            services-complete,
            services-ui,
            profile-context,
            profile-editor,
            profile-gate,
            profile-appearance,
            profile-ui,
            startup-anime,
            startup-anime-ui,
            tvdb-proxy,
            episode-order,
            episode-panel,
            anime-franchise,
            anime-episode-pool,
            franchise-extras,
            season-artwork,
            profile-return,
            mobile-integration,
            player-caption,
            continuation-sendable,
            anime-episodes,
            anime-episodes-ui,
            stable-tablet-ui,
            stable-tablet-rotation,
            reuse,
          ]
        default: full
      source_sha:
        description: "Exact previously tested application commit, for reuse only"
        type: string
        default: ""
      validation_runs:
        description: "Completed evidence runs (exact source for reuse; reviewed unchanged cases for feature follow-ups)"
        type: string
        default: ""
      native_test_selection:
        description: "Optional comma-separated affected native test identifiers; leave blank for the complete feature group"
        type: string
        default: ""
      reviewed_external_failures:
        description: "JSON records identifying reviewed external service failures"
        type: string
        default: "[]"
      evidence_run:
        description: "Completed run containing a diagnostic screenshot draft"
        type: string
        default: ""
      save_draft_build:
        description: "Save validation evidence, or the final IPA when packaging is explicitly enabled"
        type: boolean
        default: false
      upload_artifacts:
        description: "Upload products/evidence only after confirming available free storage"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      [
        "harbor-core/**",
        "harbor-ios-bridge/**",
        "ios/**",
        "scripts/ios/**",
        ".github/workflows/ios.yml",
      ]
  pull_request:
    paths:
      [
        "harbor-core/**",
        "harbor-ios-bridge/**",
        "ios/**",
        "scripts/ios/**",
        ".github/workflows/ios.yml",
      ]
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  apple:
    name: Apple SDK / Swift / iPhone
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false && inputs.validation_scope != 'reuse' && inputs.validation_scope != 'continuation-sendable' }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      HARBOR_NATIVE_SELECTION: ${{ inputs.native_test_selection }}
      HARBOR_PREVIOUS_RUNS: ${{ inputs.validation_runs }}
      HARBOR_PREVIOUS_SOURCE: ${{ inputs.source_sha }}
      HARBOR_VALIDATION_SCOPE: ${{ inputs.validation_scope }}
    steps:
      - uses: actions/checkout@v6
      - name: Preserve actual model and language passes before pending mobile UI
        if: ${{ inputs.validation_scope == 'startup-anime-ui' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${{ inputs.validation_only }}" = "true"
          test "${{ inputs.run_live_integration }}" = "false"
          python3 scripts/ios/verify-startup-anime-ui.py --output ios/build/preserved-startup-anime-ui.json
      - name: Select only new startup and anime grouping model behavior
        if: ${{ inputs.validation_scope == 'startup-anime' }}
        run: |
          test "${{ inputs.validation_only }}" = "true"
          test "${{ inputs.run_live_integration }}" = "false"
          python3 scripts/ios/prepare-startup-anime-selection.py --output ios/build/preserved-startup-anime.json
      - name: Verify the unchanged app and test-only player fixture
        if: ${{ inputs.validation_scope == 'player-caption' }}
        run: python3 scripts/ios/verify-player-caption.py --output ios/build/preserved-player-caption.json
      - name: Preserve actual appearance and gate results before normal profile UI
        if: ${{ inputs.validation_scope == 'profile-ui' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${{ inputs.validation_only }}" = "true"
          test "${{ inputs.run_live_integration }}" = "false"
          python3 scripts/ios/verify-profile-ui.py --output ios/build/preserved-profile-ui.json
      - name: Preserve unchanged profile evidence before appearance integration
        if: ${{ inputs.validation_scope == 'profile-appearance' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-profile-appearance.py --output ios/build/preserved-profile-appearance.json
      - name: Preserve 62 actual passes before the new normal-profile editing gates
        if: ${{ inputs.validation_scope == 'profile-gate' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-profile-gate.py --output ios/build/preserved-profile-gate.json
      - name: Preserve approved profile models before editor transactions
        if: ${{ inputs.validation_scope == 'profile-editor' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-profile-editor.py --output ios/build/preserved-profile-editor.json
      - name: Verify the frozen profile context before its first native execution
        if: ${{ inputs.validation_scope == 'profile-context' }}
        run: python3 scripts/ios/verify-profile-context.py --output ios/build/preserved-profile-source.json
      - name: Preserve actual passes before the six pending service UI routes
        id: services_ui_preserved
        if: ${{ inputs.validation_scope == 'services-ui' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-services-ui.py --output ios/build/preserved-services-ui.json
      - name: Preserve actual setup while reviewing both new service slices
        if: ${{ inputs.validation_scope == 'services-complete' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-services-complete.py --output ios/build/preserved-services-complete.json
      - name: Preserve accepted browser and account behavior before service synchronization
        if: ${{ inputs.validation_scope == 'streaming-sync' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-streaming-sync.py --output ios/build/preserved-streaming-sync.json
      - name: Preserve approved setup before the full service browser
        if: ${{ inputs.validation_scope == 'service-browser' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-service-browser.py --output ios/build/preserved-service-browser.json
      - name: Preserve approved unrelated behavior before the complete setup flow
        if: ${{ inputs.validation_scope == 'onboarding-desktop' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-onboarding-desktop.py --output ios/build/preserved-onboarding-desktop.json
      - name: Preserve approved unrelated behavior before navigation synchronization
        if: ${{ inputs.validation_scope == 'navigation-sync' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-navigation-sync.py --output ios/build/preserved-navigation-sync.json
      - name: Preserve approved unrelated behavior before system maintenance
        if: ${{ inputs.validation_scope == 'system-maintenance' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-system-maintenance.py --output ios/build/preserved-system-maintenance.json
      - name: Preserve corrected continuity and unrelated behavior before language expansion
        if: ${{ inputs.validation_scope == 'language-reference' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-language-reference.py --output ios/build/preserved-language-reference.json
      - name: Preserve unrelated build 91 validation for Desktop continuity parity
        if: ${{ inputs.validation_scope == 'continuation-parity' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-continuation-parity.py --source "$HARBOR_PREVIOUS_SOURCE" --output ios/build/preserved-continuation-parity.json
      - name: Preserve approved anime metadata and native checks before UI follow-up
        if: ${{ inputs.validation_scope == 'anime-episodes-ui' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-anime-ui.py --source "$HARBOR_PREVIOUS_SOURCE" --output ios/build/preserved-anime-ui.json
      - name: Preserve unrelated build 90 validation before anime episode corrections
        if: ${{ inputs.validation_scope == 'anime-episodes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-anime-episodes.py --source "$HARBOR_PREVIOUS_SOURCE" --output ios/build/preserved-anime-validation.json
      - name: Preserve approved phone reading and providers before isolated iPad review
        if: ${{ inputs.validation_scope == 'reading-tablet-final' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-reading-tablet.py --source "$HARBOR_PREVIOUS_SOURCE" --output ios/build/preserved-reading-tablet.json
      - name: Preserve approved native and live providers before final reading review
        if: ${{ inputs.validation_scope == 'reading-final' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-reading-final.py --source "$HARBOR_PREVIOUS_SOURCE" --output ios/build/preserved-reading-final.json
      - name: Preserve approved native reading checks before provider and UI follow-up
        if: ${{ inputs.validation_scope == 'reading-followup' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-reading-followup.py --source "$HARBOR_PREVIOUS_SOURCE" --run 38731103925 --output ios/build/preserved-reading-validation.json
      - name: Verify the unchanged application and approved phone and tablet evidence
        if: ${{ inputs.validation_scope == 'stable-tablet-ui' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-tablet-followup.py --source "$HARBOR_PREVIOUS_SOURCE" --run 38638771998 --output ios/build/preserved-mobile-validation.json
      - name: Preserve the compiled candidate and its accepted tests before rotation review
        if: ${{ inputs.validation_scope == 'stable-tablet-rotation' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-tablet-rotation.py --source "$HARBOR_PREVIOUS_SOURCE" --run 38649513761 --output ios/build/rotation-preservation.json
      - name: Validate focused native follow-up selection
        if: ${{ (inputs.validation_scope == 'sources-search-subtitles' || inputs.validation_scope == 'mobile-sources-subtitles' || inputs.validation_scope == 'stable-mobile') && inputs.native_test_selection != '' }}
        run: python3 scripts/ios/select-feature-tests.py --selection "$HARBOR_NATIVE_SELECTION" --output ios/build/feature-native-selection.txt
      - name: Check reserved feature delivery draft before compiling
        if: ${{ inputs.validation_only == false && (inputs.validation_scope == 'sources-search-subtitles' || inputs.validation_scope == 'mobile-sources-subtitles' || inputs.validation_scope == 'stable-mobile' || inputs.validation_scope == 'stable-tablet-ui' || inputs.validation_scope == 'stable-tablet-rotation' || inputs.validation_scope == 'reading-intro' || inputs.validation_scope == 'reading-followup' || inputs.validation_scope == 'reading-final' || inputs.validation_scope == 'reading-tablet-final' || inputs.validation_scope == 'anime-episodes' || inputs.validation_scope == 'anime-episodes-ui' || inputs.validation_scope == 'continuation-parity' || inputs.validation_scope == 'language-reference') && inputs.save_draft_build == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="iphone-unsigned-${GITHUB_SHA:0:12}"
          if [[ "${{ inputs.validation_scope }}" == "stable-tablet-rotation" ]]; then tag="iphone-rotation-${GITHUB_SHA:0:12}"; fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > /tmp/harbor-reserved.json
          python3 -c 'import json,os; v=json.load(open("/tmp/harbor-reserved.json")); assert v["isDraft"] and v["targetCommitish"] == os.environ["GITHUB_SHA"]'
          mkdir -p ios/build
          python3 -c 'import json,os; json.dump({"source":os.environ["GITHUB_SHA"],"scope":"${{ inputs.validation_scope }}","preservedBaseline":"c3e3d28abc46b868417f655b4167394c2a48b22c","nativeSelection":os.environ.get("HARBOR_NATIVE_SELECTION"),"preservedFeatureRuns":os.environ.get("HARBOR_PREVIOUS_RUNS")},open("ios/build/validation-plan.json","w"),indent=2)'
          gh release upload "$tag" ios/build/validation-plan.json --repo "$GITHUB_REPOSITORY"
      - name: Select installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Parse Swift before building dependencies
        run: python3 scripts/ios/parse-swift.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            harbor-core
            harbor-ios-bridge
      - name: Verify shared Rust on the Apple build host
        if: ${{ inputs.validation_scope != 'affected' && inputs.validation_scope != 'sources-search-subtitles' && inputs.validation_scope != 'mobile-sources-subtitles' && inputs.validation_scope != 'stable-mobile' && inputs.validation_scope != 'stable-tablet-ui' && inputs.validation_scope != 'stable-tablet-rotation' && inputs.validation_scope != 'reading-intro' && inputs.validation_scope != 'reading-followup' && inputs.validation_scope != 'reading-final' && inputs.validation_scope != 'reading-tablet-final' && inputs.validation_scope != 'anime-episodes' && inputs.validation_scope != 'anime-episodes-ui' && inputs.validation_scope != 'continuation-parity' && inputs.validation_scope != 'language-reference' && inputs.validation_scope != 'system-maintenance' && inputs.validation_scope != 'navigation-sync' && inputs.validation_scope != 'onboarding-desktop' && inputs.validation_scope != 'service-browser' && inputs.validation_scope != 'streaming-sync' && inputs.validation_scope != 'services-complete' && inputs.validation_scope != 'services-ui' && inputs.validation_scope != 'profile-context' && inputs.validation_scope != 'profile-editor' && inputs.validation_scope != 'profile-gate' && inputs.validation_scope != 'profile-appearance' && inputs.validation_scope != 'profile-ui' && inputs.validation_scope != 'player-caption' && inputs.validation_scope != 'startup-anime' && inputs.validation_scope != 'startup-anime-ui' && inputs.validation_scope != 'tvdb-proxy' && inputs.validation_scope != 'episode-order' && inputs.validation_scope != 'episode-panel' && inputs.validation_scope != 'anime-franchise' && inputs.validation_scope != 'anime-episode-pool' && inputs.validation_scope != 'franchise-extras' && inputs.validation_scope != 'season-artwork' && inputs.validation_scope != 'profile-return' && inputs.validation_scope != 'mobile-integration' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path harbor-core/Cargo.toml --locked --no-default-features
          cargo test --manifest-path harbor-ios-bridge/Cargo.toml --locked
          cargo clippy --manifest-path harbor-ios-bridge/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build and package Rust before Swift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/logs
          bash scripts/ios/build-rust.sh 2>&1 | tee ios/build/logs/rust.log
      - name: Cache Swift dependencies
        uses: actions/cache@v6
        with:
          path: ios/build/SourcePackages
          key: iphone-spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: iphone-spm-${{ runner.os }}-
      - name: Generate Xcode project
        run: |
          python3 scripts/ios/fetch-interface-font.py
          python3 scripts/ios/fetch-manga-font.py
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned multimedia dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ios/resolve-packages.py
      - name: Choose an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > ios/build/devices.json
          device=$(python3 -c 'import json; d=json.load(open("ios/build/devices.json")); prefix="iPad" if "${{ inputs.validation_scope }}" in ["stable-tablet-ui", "stable-tablet-rotation", "reading-tablet-final"] else "iPhone"; print(next(x["udid"] for runtime, values in d["devices"].items() if "iOS" in runtime for x in values if x["name"].startswith(prefix)))')
          echo "IOS_SIMULATOR=$device" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device" -b
      - name: Build simulator
        id: simulator_build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/SimulatorBuild.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee ios/build/logs/simulator.log
      - name: Preserve simulator compiler diagnostics
        if: ${{ failure() && steps.simulator_build.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d ios/build/SimulatorBuild.xcresult ]]; then
            xcrun xcresulttool get object --legacy --format json --path ios/build/SimulatorBuild.xcresult > ios/build/logs/simulator-result.json || true
          fi
          python3 scripts/ios/report-build-issues.py ios/build/logs/simulator-result.json
          if [[ "${{ inputs.save_draft_build }}" == "true" ]]; then
            ditto -c -k --keepParent ios/build/logs ios/build/iphone-compiler-evidence.zip
            gh release create "iphone-compiler-evidence-$GITHUB_RUN_ID" ios/build/iphone-compiler-evidence.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "iPhone compiler evidence $GITHUB_RUN_ID" --notes "Public build diagnostics only. No private account, configured addon URL or installable app."
          fi
      - name: Prepare a clean host for isolated setup model tests
        if: ${{ inputs.validation_scope == 'onboarding-desktop' || inputs.validation_scope == 'service-browser' || inputs.validation_scope == 'streaming-sync' || inputs.validation_scope == 'services-complete' || inputs.validation_scope == 'services-ui' || inputs.validation_scope == 'profile-context' || inputs.validation_scope == 'profile-editor' || inputs.validation_scope == 'profile-gate' || inputs.validation_scope == 'profile-appearance' || inputs.validation_scope == 'player-caption' || inputs.validation_scope == 'startup-anime' || inputs.validation_scope == 'tvdb-proxy' || inputs.validation_scope == 'episode-order' || inputs.validation_scope == 'episode-panel' || inputs.validation_scope == 'anime-franchise' || inputs.validation_scope == 'anime-episode-pool' || inputs.validation_scope == 'franchise-extras' || inputs.validation_scope == 'season-artwork' || inputs.validation_scope == 'profile-return' || inputs.validation_scope == 'mobile-integration' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$IOS_SIMULATOR" || true
          xcrun simctl boot "$IOS_SIMULATOR"
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b
          xcrun simctl install "$IOS_SIMULATOR" ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Harbor.app
          container=$(xcrun simctl get_app_container "$IOS_SIMULATOR" site.harbor.iphone data)
          python3 scripts/ios/prepare-model-test-startup.py --container "$container"
      - name: Combine unexecuted affected scopes after the shared Swift compiler repair
        if: ${{ inputs.validation_scope == 'mobile-integration' }}
        run: python3 scripts/ios/prepare-mobile-integration-selection.py
      - name: Select new profile foreground behavior and the one failed phone journey
        if: ${{ inputs.validation_scope == 'profile-return' }}
        run: python3 scripts/ios/prepare-profile-return-selection.py
      - name: Select only the new season artwork behavior
        if: ${{ inputs.validation_scope == 'season-artwork' }}
        run: python3 scripts/ios/prepare-season-artwork-selection.py
      - name: Select new movie and special behavior while retaining actual prior passes
        if: ${{ inputs.validation_scope == 'franchise-extras' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.validation_only }}" = "true"
          test "${{ inputs.run_live_integration }}" = "false"
          python3 scripts/ios/prepare-franchise-extras-selection.py
      - name: Select the new source-aware pool and its affected behavior
        if: ${{ inputs.validation_scope == 'anime-episode-pool' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.validation_only }}" = "true"
          test "${{ inputs.run_live_integration }}" = "false"
          python3 scripts/ios/prepare-anime-episode-pool-selection.py
      - name: Select only new franchise behavior and the affected public mapping adapter
        if: ${{ inputs.validation_scope == 'anime-franchise' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.validation_only }}" = "true"
          test "${{ inputs.run_live_integration }}" = "false"
          python3 scripts/ios/prepare-anime-franchise-selection.py
      - name: Select new and affected episode-panel behavior
        if: ${{ inputs.validation_scope == 'episode-panel' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.validation_only }}" = "true"
          test "${{ inputs.run_live_integration }}" = "false"
          python3 scripts/ios/prepare-episode-panel-selection.py
      - name: Select only the new Desktop episode-order engine cases
        if: ${{ inputs.validation_scope == 'episode-order' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.validation_only }}" = "true"
          test "${{ inputs.run_live_integration }}" = "false"
          python3 scripts/ios/prepare-episode-order-selection.py
      - name: Select only the new TVDB replacement checks
        if: ${{ inputs.validation_scope == 'tvdb-proxy' }}
        run: python3 scripts/ios/prepare-tvdb-proxy-selection.py --output ios/build/preserved-tvdb-proxy.json
      - name: Run bridge and model tests on iPhone simulator
        id: offline_tests
        if: ${{ inputs.validation_scope != 'stable-tablet-ui' && inputs.validation_scope != 'stable-tablet-rotation' && inputs.validation_scope != 'anime-episodes-ui' && inputs.validation_scope != 'services-ui' && inputs.validation_scope != 'profile-ui' && inputs.validation_scope != 'startup-anime-ui' }}
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          selection=(-only-testing:HarborTests)
          if [[ "${{ inputs.validation_scope }}" == "mobile-integration" ]]; then
            selection=()
            while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < ios/build/mobile-integration-selection.txt
            test ${#selection[@]} -eq 30
          elif [[ "${{ inputs.validation_scope }}" == "profile-return" ]]; then
            selection=()
            while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < ios/build/profile-return-selection.txt
            test ${#selection[@]} -eq 2
          elif [[ "${{ inputs.validation_scope }}" == "season-artwork" ]]; then
            selection=()
            while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < ios/build/season-artwork-selection.txt
            test ${#selection[@]} -eq 8
          elif [[ "${{ inputs.validation_scope }}" == "franchise-extras" ]]; then
            selection=()
            while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < ios/build/franchise-extras-selection.txt
            test ${#selection[@]} -eq 13
          elif [[ "${{ inputs.validation_scope }}" == "anime-episode-pool" ]]; then
            selection=()
            while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < ios/build/anime-episode-pool-selection.txt
            test ${#selection[@]} -eq 24
          elif [[ "${{ inputs.validation_scope }}" == "anime-franchise" ]]; then
            selection=()
            while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < ios/build/anime-franchise-selection.txt
            test ${#selection[@]} -eq 9
          elif [[ "${{ inputs.validation_scope }}" == "episode-panel" ]]; then
            selection=()
            while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < ios/build/episode-panel-selection.txt
            test ${#selection[@]} -eq 10
          elif [[ "${{ inputs.validation_scope }}" == "episode-order" ]]; then
            selection=()
