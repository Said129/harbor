name: iPhone Native
on:
  workflow_dispatch:
    inputs:
      run_live_integration:
        description: "Test the native services and UI with real public addons"
        type: boolean
        default: false
      validation_scope:
        description: "Full suite, browser/palette regressions, or preserved exact-source validation"
        type: choice
        options:
          [
            full,
            affected,
            sources-search-subtitles,
            mobile-sources-subtitles,
            stable-mobile,
            reading-intro,
            reading-followup,
            stable-tablet-ui,
            stable-tablet-rotation,
            reuse,
          ]
        default: full
      source_sha:
        description: "Exact previously tested application commit, for reuse only"
        type: string
        default: ""
      validation_runs:
        description: "Completed evidence runs (exact source for reuse; reviewed unchanged cases for feature follow-ups)"
        type: string
        default: ""
      native_test_selection:
        description: "Optional comma-separated affected native test identifiers; leave blank for the complete feature group"
        type: string
        default: ""
      reviewed_external_failures:
        description: "JSON records identifying reviewed external service failures"
        type: string
        default: "[]"
      evidence_run:
        description: "Completed run containing a diagnostic screenshot draft"
        type: string
        default: ""
      save_draft_build:
        description: "Save the verified unsigned IPA in a draft Release for download"
        type: boolean
        default: false
      upload_artifacts:
        description: "Upload products/evidence only after confirming available free storage"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      [
        "harbor-core/**",
        "harbor-ios-bridge/**",
        "ios/**",
        "scripts/ios/**",
        ".github/workflows/ios.yml",
      ]
  pull_request:
    paths:
      [
        "harbor-core/**",
        "harbor-ios-bridge/**",
        "ios/**",
        "scripts/ios/**",
        ".github/workflows/ios.yml",
      ]
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  apple:
    name: Apple SDK / Swift / iPhone
    if: ${{ github.event.repository.private == false && inputs.validation_scope != 'reuse' }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      HARBOR_NATIVE_SELECTION: ${{ inputs.native_test_selection }}
      HARBOR_PREVIOUS_RUNS: ${{ inputs.validation_runs }}
      HARBOR_PREVIOUS_SOURCE: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Preserve approved native reading checks before provider and UI follow-up
        if: ${{ inputs.validation_scope == 'reading-followup' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-reading-followup.py --source "$HARBOR_PREVIOUS_SOURCE" --run 38731103925 --output ios/build/preserved-reading-validation.json
      - name: Verify the unchanged application and approved phone and tablet evidence
        if: ${{ inputs.validation_scope == 'stable-tablet-ui' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-tablet-followup.py --source "$HARBOR_PREVIOUS_SOURCE" --run 38638771998 --output ios/build/preserved-mobile-validation.json
      - name: Preserve the compiled candidate and its accepted tests before rotation review
        if: ${{ inputs.validation_scope == 'stable-tablet-rotation' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios/verify-tablet-rotation.py --source "$HARBOR_PREVIOUS_SOURCE" --run 38649513761 --output ios/build/rotation-preservation.json
      - name: Validate focused native follow-up selection
        if: ${{ (inputs.validation_scope == 'sources-search-subtitles' || inputs.validation_scope == 'mobile-sources-subtitles' || inputs.validation_scope == 'stable-mobile') && inputs.native_test_selection != '' }}
        run: python3 scripts/ios/select-feature-tests.py --selection "$HARBOR_NATIVE_SELECTION" --output ios/build/feature-native-selection.txt
      - name: Check reserved feature delivery draft before compiling
        if: ${{ (inputs.validation_scope == 'sources-search-subtitles' || inputs.validation_scope == 'mobile-sources-subtitles' || inputs.validation_scope == 'stable-mobile' || inputs.validation_scope == 'stable-tablet-ui' || inputs.validation_scope == 'stable-tablet-rotation' || inputs.validation_scope == 'reading-intro' || inputs.validation_scope == 'reading-followup') && inputs.save_draft_build == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="iphone-unsigned-${GITHUB_SHA:0:12}"
          if [[ "${{ inputs.validation_scope }}" == "stable-tablet-rotation" ]]; then tag="iphone-rotation-${GITHUB_SHA:0:12}"; fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > /tmp/harbor-reserved.json
          python3 -c 'import json,os; v=json.load(open("/tmp/harbor-reserved.json")); assert v["isDraft"] and v["targetCommitish"] == os.environ["GITHUB_SHA"]'
          mkdir -p ios/build
          python3 -c 'import json,os; json.dump({"source":os.environ["GITHUB_SHA"],"scope":"${{ inputs.validation_scope }}","preservedBaseline":"c3e3d28abc46b868417f655b4167394c2a48b22c","nativeSelection":os.environ.get("HARBOR_NATIVE_SELECTION"),"preservedFeatureRuns":os.environ.get("HARBOR_PREVIOUS_RUNS")},open("ios/build/validation-plan.json","w"),indent=2)'
          gh release upload "$tag" ios/build/validation-plan.json --repo "$GITHUB_REPOSITORY"
      - name: Select installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Parse Swift before building dependencies
        run: python3 scripts/ios/parse-swift.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            harbor-core
            harbor-ios-bridge
      - name: Verify shared Rust on the Apple build host
        if: ${{ inputs.validation_scope != 'affected' && inputs.validation_scope != 'sources-search-subtitles' && inputs.validation_scope != 'mobile-sources-subtitles' && inputs.validation_scope != 'stable-mobile' && inputs.validation_scope != 'stable-tablet-ui' && inputs.validation_scope != 'stable-tablet-rotation' && inputs.validation_scope != 'reading-intro' && inputs.validation_scope != 'reading-followup' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path harbor-core/Cargo.toml --locked --no-default-features
          cargo test --manifest-path harbor-ios-bridge/Cargo.toml --locked
          cargo clippy --manifest-path harbor-ios-bridge/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build and package Rust before Swift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/logs
          bash scripts/ios/build-rust.sh 2>&1 | tee ios/build/logs/rust.log
      - name: Cache Swift dependencies
        uses: actions/cache@v6
        with:
          path: ios/build/SourcePackages
          key: iphone-spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: iphone-spm-${{ runner.os }}-
      - name: Generate Xcode project
        run: |
          python3 scripts/ios/fetch-interface-font.py
          python3 scripts/ios/fetch-manga-font.py
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned multimedia dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ios/resolve-packages.py
      - name: Choose an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > ios/build/devices.json
          device=$(python3 -c 'import json; d=json.load(open("ios/build/devices.json")); prefix="iPad" if "${{ inputs.validation_scope }}" in ["stable-tablet-ui", "stable-tablet-rotation"] else "iPhone"; print(next(x["udid"] for runtime, values in d["devices"].items() if "iOS" in runtime for x in values if x["name"].startswith(prefix)))')
          echo "IOS_SIMULATOR=$device" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device" -b
      - name: Build simulator
        id: simulator_build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/SimulatorBuild.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee ios/build/logs/simulator.log
      - name: Preserve simulator compiler diagnostics
        if: ${{ failure() && steps.simulator_build.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d ios/build/SimulatorBuild.xcresult ]]; then
            xcrun xcresulttool get object --legacy --format json --path ios/build/SimulatorBuild.xcresult > ios/build/logs/simulator-result.json || true
          fi
          python3 scripts/ios/report-build-issues.py ios/build/logs/simulator-result.json
          if [[ "${{ inputs.save_draft_build }}" == "true" ]]; then
            ditto -c -k --keepParent ios/build/logs ios/build/iphone-compiler-evidence.zip
            gh release create "iphone-compiler-evidence-$GITHUB_RUN_ID" ios/build/iphone-compiler-evidence.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "iPhone compiler evidence $GITHUB_RUN_ID" --notes "Public build diagnostics only. No private account, configured addon URL or installable app."
          fi
      - name: Run bridge and model tests on iPhone simulator
        id: offline_tests
        if: ${{ inputs.validation_scope != 'stable-tablet-ui' && inputs.validation_scope != 'stable-tablet-rotation' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          selection=(-only-testing:HarborTests)
          if [[ "${{ inputs.validation_scope }}" == "reading-followup" ]]; then
            selection=(-only-testing:HarborTests/ReadingUpdatesTests/testPrepareOrdinaryReadingShelfUIFixtures)
          elif [[ "${{ inputs.validation_scope }}" == "reading-intro" ]]; then
            selection=(-only-testing:HarborTests/ReadingUpdatesTests -only-testing:HarborTests/StableMobileTests/testImportEPUBAndPDFKeepsOwnerIsolationAndReadingPosition -only-testing:HarborTests/StableMobileTests/testReopeningEPUBDoesNotRewriteTheCachedPublication -only-testing:HarborTests/MangaArchiveTests/testActualCBZImagesUseNaturalOrderAndNeverExposeUnsafePaths)
          elif [[ "${{ inputs.validation_scope }}" == "affected" ]]; then
            selection=(-only-testing:HarborTests/WebPageDialogTests)
          elif [[ "${{ inputs.validation_scope }}" == "sources-search-subtitles" || "${{ inputs.validation_scope }}" == "mobile-sources-subtitles" || "${{ inputs.validation_scope }}" == "stable-mobile" ]]; then
            selection=(-only-testing:HarborTests/SearchAndSourcesTests -only-testing:HarborTests/SubtitleAutoSyncTests -only-testing:HarborTests/SubtitlePlaybackTests -only-testing:HarborTests/AccountCollectionTests)
            if [[ "${{ inputs.validation_scope }}" == "mobile-sources-subtitles" ]]; then
              selection=(-only-testing:HarborTests/MobileSourcesAndSubtitlesTests)
            fi
            if [[ -s ios/build/feature-native-selection.txt ]]; then
              selection=()
              while IFS= read -r identifier; do selection+=("-only-testing:$identifier"); done < ios/build/feature-native-selection.txt
            fi
          fi
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/Tests.xcresult "${selection[@]}" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/tests.log
      - name: Preserve failed native render evidence in a draft Release
        if: ${{ failure() && inputs.save_draft_build == true && steps.offline_tests.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/failed-native-render
          xcrun xcresulttool export diagnostics --path ios/build/Tests.xcresult --output-path ios/build/failed-native-render/diagnostics
          xcrun xcresulttool get object --legacy --format json --path ios/build/Tests.xcresult > ios/build/failed-native-render/test-result.json
          cp ios/build/logs/tests.log ios/build/failed-native-render/tests.log
          ditto -c -k --keepParent ios/build/failed-native-render ios/build/iphone-native-render-evidence.zip
          gh release create "iphone-native-render-evidence-$GITHUB_RUN_ID" ios/build/iphone-native-render-evidence.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "iPhone native test evidence $GITHUB_RUN_ID" --notes "Offline native test attachments, logs and crash diagnostics. No private account, configured addon URL or installable app."
      - name: Run real addon services on iPhone simulator
        id: live_services
        if: ${{ inputs.run_live_integration == true && inputs.validation_scope != 'affected' && inputs.validation_scope != 'stable-mobile' && inputs.validation_scope != 'stable-tablet-ui' && inputs.validation_scope != 'stable-tablet-rotation' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          selection=(-only-testing:HarborIntegrationTests)
          if [[ "${{ inputs.validation_scope }}" == "reading-intro" || "${{ inputs.validation_scope }}" == "reading-followup" ]]; then
            selection=(-only-testing:HarborIntegrationTests/ReadingLiveTests)
          elif [[ "${{ inputs.validation_scope }}" == "sources-search-subtitles" ]]; then
            selection=(-only-testing:HarborIntegrationTests/LiveServicesTests/testDanmachiSeasonOneEpisodeSevenUsesDesktopAliases)
          elif [[ "${{ inputs.validation_scope }}" == "mobile-sources-subtitles" ]]; then
            selection=(-only-testing:HarborIntegrationTests/LiveServicesTests/testSubtitleAddonsReturnMovieSeriesAndMappedAnimeResults)
          fi
          xcodebuild -project ios/Harbor.xcodeproj -scheme HarborLive -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/ServicesTests.xcresult "${selection[@]}" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/live-services.log
      - name: Verify the affected bundled Manga font in its native reader
        id: manga_font_tests
        if: ${{ inputs.validation_scope == 'stable-tablet-ui' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/MangaFontTests.xcresult -only-testing:HarborTests/MangaArchiveTests/testActualCBZImagesUseNaturalOrderAndNeverExposeUnsafePaths -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/manga-font.log
      - name: Prepare ordinary guest data for the pending tablet UI
        id: tablet_seed
        if: ${{ inputs.validation_scope == 'stable-tablet-ui' }}
        run: |
          set -euo pipefail
          xcrun simctl terminate "$IOS_SIMULATOR" site.harbor.iphone || true
          xcrun simctl install "$IOS_SIMULATOR" ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Harbor.app
          container=$(xcrun simctl get_app_container "$IOS_SIMULATOR" site.harbor.iphone data)
          python3 scripts/ios/seed-stable-tablet-ui.py --container "$container"
      - name: Boot a clean UI runtime while preserving application data
        id: ui_runtime
        if: ${{ !cancelled() && inputs.run_live_integration == true && steps.offline_tests.conclusion == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$IOS_SIMULATOR"
          xcrun simctl boot "$IOS_SIMULATOR"
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b
      - name: Install the unchanged app for isolated tablet rotation
        id: rotation_prepare
        if: ${{ inputs.validation_scope == 'stable-tablet-rotation' }}
        run: |
          xcrun simctl install "$IOS_SIMULATOR" ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Harbor.app
          xcrun simctl spawn "$IOS_SIMULATOR" defaults write site.harbor.iphone uiLanguage en
      - name: Run native UI on the selected simulator
        id: live_tests
        if: ${{ !cancelled() && inputs.run_live_integration == true && ((steps.offline_tests.conclusion == 'success' && steps.ui_runtime.conclusion == 'success') || (inputs.validation_scope == 'stable-tablet-ui' && steps.tablet_seed.conclusion == 'success') || (inputs.validation_scope == 'stable-tablet-rotation' && steps.rotation_prepare.conclusion == 'success')) }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.validation_scope }}" == "stable-tablet-rotation" ]]; then
            mkdir -p ios/build/rotation-evidence
            xcrun simctl io "$IOS_SIMULATOR" recordVideo --codec=h264 ios/build/rotation-evidence/tablet-rotation.mp4 > ios/build/logs/rotation-recording.log 2>&1 &
            rotation_recording_pid=$!
            finish_rotation_recording() { kill -INT "$rotation_recording_pid" 2>/dev/null || true; wait "$rotation_recording_pid" || true; }
            trap finish_rotation_recording EXIT
          fi
          selection=(-only-testing:HarborUITests)
          if [[ "${{ inputs.validation_scope }}" == "reading-intro" || "${{ inputs.validation_scope }}" == "reading-followup" ]]; then
            selection=(-only-testing:HarborUITests/ReadingNavigationTests)
          elif [[ "${{ inputs.validation_scope }}" == "stable-tablet-rotation" ]]; then
            selection=(-only-testing:HarborUITests/StableMobileNavigationTests/testReadingHelpRemainsUsableAfterTabletRotation)
          elif [[ "${{ inputs.validation_scope }}" == "affected" ]]; then
            selection=(-only-testing:HarborUITests/LiveNavigationTests/testCancellingCustomPaletteRestoresActiveTheme)
          elif [[ "${{ inputs.validation_scope }}" == "sources-search-subtitles" ]]; then
            selection=(-only-testing:HarborUITests/LiveNavigationTests/testSearchHasContentOnlyAndRemovableRecentHistory)
          elif [[ "${{ inputs.validation_scope }}" == "mobile-sources-subtitles" ]]; then
            selection=(-only-testing:HarborUITests/LiveNavigationTests/testDirectQualitySourcesAreVisibleWithoutExpansion)
          elif [[ "${{ inputs.validation_scope }}" == "stable-mobile" || "${{ inputs.validation_scope }}" == "stable-tablet-ui" ]]; then
            selection=(-only-testing:HarborUITests/StableMobileNavigationTests)
          fi
          xcodebuild -project ios/Harbor.xcodeproj -scheme HarborLive -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/LiveTests.xcresult "${selection[@]}" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/live-tests.log
      - name: Verify native iPad layouts, rotation and ordinary app interactions
        id: tablet_tests
        if: ${{ inputs.validation_scope == 'stable-mobile' && success() }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$IOS_SIMULATOR"
          tablet=$(python3 -c 'import json; d=json.load(open("ios/build/devices.json")); print(next(x["udid"] for runtime, values in d["devices"].items() if "iOS" in runtime for x in values if x["name"].startswith("iPad")))')
          xcrun simctl bootstatus "$tablet" -b
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Debug -destination "platform=iOS Simulator,id=$tablet,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/TabletTests.xcresult -only-testing:HarborTests/StableMobileTests/testTabletResizableReadingAndPlaybackOrientation -only-testing:HarborTests/StableMobileTests/testPDFReaderRestoresPageAfterLayoutAndNavigatesInBothDirections -only-testing:HarborTests/StableMobileTests/testContinueDismissalAndPrepareNormalAppUITapFixture -only-testing:HarborTests/VideoRenderingTests/testNativeRendererDisplaysDistinctColorsFrom8And10BitVideo -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/tablet-native.log
          xcrun simctl shutdown "$tablet"
          xcrun simctl bootstatus "$tablet" -b
          xcodebuild -project ios/Harbor.xcodeproj -scheme HarborLive -configuration Debug -destination "platform=iOS Simulator,id=$tablet,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/TabletUITests.xcresult -only-testing:HarborUITests/StableMobileNavigationTests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/tablet-ui.log
          xcrun simctl shutdown "$tablet"
      - name: Verify the new reading shelves and PDF Manga on iPad
        id: reading_tablet_tests
        if: ${{ (inputs.validation_scope == 'reading-intro' || inputs.validation_scope == 'reading-followup') && success() }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$IOS_SIMULATOR"
          tablet=$(python3 -c 'import json; d=json.load(open("ios/build/devices.json")); print(next(x["udid"] for runtime, values in d["devices"].items() if "iOS" in runtime for x in values if x["name"].startswith("iPad")))')
          xcrun simctl bootstatus "$tablet" -b
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Debug -destination "platform=iOS Simulator,id=$tablet,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/ReadingTabletSeed.xcresult -only-testing:HarborTests/ReadingUpdatesTests/testPrepareOrdinaryReadingShelfUIFixtures -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/reading-tablet-seed.log
          xcrun simctl shutdown "$tablet"
          xcrun simctl bootstatus "$tablet" -b
          xcodebuild -project ios/Harbor.xcodeproj -scheme HarborLive -configuration Debug -destination "platform=iOS Simulator,id=$tablet,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/ReadingTabletUI.xcresult -only-testing:HarborUITests/ReadingNavigationTests/testLocalShelvesSearchSortCoversAndPDFMangaReader -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/reading-tablet-ui.log
          xcrun simctl shutdown "$tablet"
      - name: Preserve failed public integration screenshots in a draft Release
        if: ${{ always() && inputs.validation_scope != 'stable-tablet-rotation' && inputs.save_draft_build == true && (steps.live_tests.conclusion == 'failure' || steps.live_tests.conclusion == 'cancelled' || steps.live_services.conclusion == 'failure' || steps.live_services.conclusion == 'cancelled' || steps.tablet_tests.conclusion == 'failure' || steps.manga_font_tests.conclusion == 'failure' || steps.reading_tablet_tests.conclusion == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/attachments
          for name in Tests ServicesTests LiveTests TabletTests TabletUITests MangaFontTests ReadingTabletSeed ReadingTabletUI; do
            if [ -d "ios/build/$name.xcresult" ]; then
              xcrun xcresulttool export attachments --path "ios/build/$name.xcresult" --output-path "ios/build/attachments/$name"
            fi
          done
          ditto -c -k --keepParent ios/build/attachments ios/build/iphone-test-evidence.zip
          gh release create "iphone-test-evidence-$GITHUB_RUN_ID" ios/build/iphone-test-evidence.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "iPhone public integration evidence $GITHUB_RUN_ID" --notes "Failed native integration test screenshots from public Cinemeta and the official Stremio example addon. This is diagnostic evidence, not an installable app."
      - name: Save tablet rotation evidence without rebuilding the accepted IPA
        if: ${{ always() && inputs.validation_scope == 'stable-tablet-rotation' && inputs.save_draft_build == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/rotation-evidence
          cp ios/build/rotation-preservation.json ios/build/rotation-evidence/
          cp -R ios/build/logs ios/build/rotation-evidence/
          if [[ -d ios/build/LiveTests.xcresult ]]; then
            xcrun xcresulttool export attachments --path ios/build/LiveTests.xcresult --output-path ios/build/rotation-evidence/attachments
          fi
          ditto -c -k --keepParent ios/build/rotation-evidence ios/build/tablet-rotation-evidence.zip
          gh release upload "iphone-rotation-${GITHUB_SHA:0:12}" ios/build/tablet-rotation-evidence.zip --repo "$GITHUB_REPOSITORY"
      - name: Build device without signing
        if: ${{ inputs.validation_scope != 'stable-tablet-rotation' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$IOS_SIMULATOR" || true
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build/DeviceData -clonedSourcePackagesDirPath ios/build/SourcePackages CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee ios/build/logs/device.log
      - name: Package and verify unsigned iPhone IPA
        if: ${{ inputs.validation_scope != 'stable-tablet-rotation' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ios/package-ipa.py --app ios/build/DeviceData/Build/Products/Release-iphoneos/Harbor.app --output ios/build/Harbor-unsigned.ipa --commit "$GITHUB_SHA" 2>&1 | tee ios/build/logs/ipa.log
      - name: Save verified unsigned IPA in a draft Release
        if: ${{ inputs.validation_scope != 'stable-tablet-rotation' && github.event_name == 'workflow_dispatch' && inputs.run_live_integration == true && inputs.save_draft_build == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/live-attachments
          if [[ -d ios/build/LiveTests.xcresult ]]; then
            xcrun xcresulttool export attachments --path ios/build/LiveTests.xcresult --output-path ios/build/live-attachments
          fi
          if [[ -d ios/build/ServicesTests.xcresult ]]; then
            xcrun xcresulttool export attachments --path ios/build/ServicesTests.xcresult --output-path ios/build/live-attachments/services
          fi
          if [[ -d ios/build/Tests.xcresult ]]; then
            xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/live-attachments/native-tests
          fi
          if [[ -f ios/build/preserved-mobile-validation.json ]]; then
            cp ios/build/preserved-mobile-validation.json ios/build/live-attachments/
          fi
          if [[ -f ios/build/preserved-reading-validation.json ]]; then
            cp ios/build/preserved-reading-validation.json ios/build/live-attachments/
          fi
          for name in TabletTests TabletUITests MangaFontTests ReadingTabletSeed ReadingTabletUI; do
            if [[ -d "ios/build/$name.xcresult" ]]; then
              xcrun xcresulttool export attachments --path "ios/build/$name.xcresult" --output-path "ios/build/live-attachments/$name"
            fi
          done
          ditto -c -k --keepParent ios/build/live-attachments ios/build/iphone-live-evidence.zip
          python3 scripts/ios/save-draft-build.py --repo "$GITHUB_REPOSITORY" --ipa ios/build/Harbor-unsigned.ipa --report ios/build/Harbor-unsigned.json --commit "$GITHUB_SHA" --evidence ios/build/iphone-live-evidence.zip --validation-scope "${{ inputs.validation_scope }}" --native-selection "$HARBOR_NATIVE_SELECTION" --previous-runs "$HARBOR_PREVIOUS_RUNS"
      - name: Preserve diagnostic evidence
        if: ${{ always() && inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: iphone-build-evidence
          path: |
            ios/build/logs
            ios/build/Tests.xcresult
            ios/build/LiveTests.xcresult
            ios/build/Harbor-unsigned.json
            ios/build/devices.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload unsigned build products
        if: ${{ inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: iphone-unsigned-products
          path: |
            ios/Frameworks/HarborCore.xcframework
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Harbor.app
            ios/build/DeviceData/Build/Products/Release-iphoneos/Harbor.app
            ios/Harbor.xcodeproj
            ios/build/Harbor-unsigned.ipa
            ios/build/Harbor-unsigned.json
          retention-days: 1

  package-reviewed:
    name: Package iPhone from preserved validation
    if: ${{ github.event.repository.private == false && inputs.validation_scope == 'reuse' }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      VALIDATED_SOURCE: ${{ inputs.source_sha }}
      VALIDATION_RUNS: ${{ inputs.validation_runs }}
      REVIEWED_EXTERNAL_FAILURES: ${{ inputs.reviewed_external_failures }}
      EVIDENCE_RUN: ${{ inputs.evidence_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Preserve the validation reuse tool
        run: cp scripts/ios/reuse-iphone-validation.py "$RUNNER_TEMP/reuse-iphone-validation.py"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify preserved tests against the exact application source
        id: preserved
        run: python3 "$RUNNER_TEMP/reuse-iphone-validation.py" --source "$VALIDATED_SOURCE" --runs "$VALIDATION_RUNS" --external-failures "$REVIEWED_EXTERNAL_FAILURES" --output ios/build/validation-proof.json
      - name: Confirm write access to the reserved draft before building
        run: |
          set -euo pipefail
          tag="iphone-unsigned-${VALIDATED_SOURCE:0:12}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets > ios/build/reserved-draft.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          draft = json.loads(Path('ios/build/reserved-draft.json').read_text())
          assert draft['isDraft'] and draft['targetCommitish'] == os.environ['VALIDATED_SOURCE']
          assert not any(item['name'].endswith(('.ipa', '.zip')) for item in draft['assets']), 'A build artifact already exists; review it before replacement'
          PY
          gh release upload "$tag" ios/build/validation-proof.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Select installed Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            harbor-ios-bridge
      - name: Build and package Rust before Swift
        run: |
          set -euo pipefail
          mkdir -p ios/build/logs
          bash scripts/ios/build-rust.sh 2>&1 | tee ios/build/logs/rust.log
      - name: Cache Swift dependencies
        uses: actions/cache@v6
        with:
          path: ios/build/SourcePackages
          key: iphone-spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: iphone-spm-${{ runner.os }}-
      - name: Generate Xcode project
        run: |
          python3 scripts/ios/fetch-interface-font.py
          python3 scripts/ios/fetch-manga-font.py
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Resolve pinned multimedia dependencies
        run: python3 scripts/ios/resolve-packages.py
      - name: Choose an available iPhone simulator
        if: steps.preserved.outputs.needs_ui == 'true'
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > ios/build/devices.json
          device=$(python3 -c 'import json; d=json.load(open("ios/build/devices.json")); print(next(x["udid"] for runtime, values in d["devices"].items() if "iOS" in runtime for x in values if x["name"].startswith("iPhone")))')
          echo "IOS_SIMULATOR=$device" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device" -b
      - name: Build simulator for pending UI only
        if: steps.preserved.outputs.needs_ui == 'true'
        run: |
          set -euo pipefail
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee ios/build/logs/simulator.log
      - name: Run only UI methods without an approved result
        if: steps.preserved.outputs.needs_ui == 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          selection=()
          while IFS= read -r method; do selection+=("-only-testing:$method"); done < ios/build/pending-ui-selection.txt
          test ${#selection[@]} -gt 0
          xcodebuild -project ios/Harbor.xcodeproj -scheme HarborLive -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR,arch=$IOS_SIMULATOR_ARCH" -derivedDataPath ios/build/DerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages -resultBundlePath ios/build/PendingUI.xcresult "${selection[@]}" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee ios/build/logs/pending-ui.log
          python3 "$RUNNER_TEMP/reuse-iphone-validation.py" --source "$VALIDATED_SOURCE" --runs "$VALIDATION_RUNS" --external-failures "$REVIEWED_EXTERNAL_FAILURES" --output ios/build/validation-proof.json --complete-ui-log ios/build/logs/pending-ui.log
      - name: Preserve actual reviewed-source screenshots
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          proof = json.loads(Path('ios/build/validation-proof.json').read_text())
          assert proof['complete'] and not proof['pending_ui']
          assert proof['application_source'] == os.environ['VALIDATED_SOURCE']
          if os.environ['EVIDENCE_RUN']:
              assert int(os.environ['EVIDENCE_RUN']) in {run['id'] for run in proof['runs']}
          PY
          mkdir -p ios/build/reviewed-evidence
          if [[ -n "$EVIDENCE_RUN" ]]; then
            [[ "$EVIDENCE_RUN" =~ ^[0-9]+$ ]]
            gh release view "iphone-test-evidence-$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" --json targetCommitish > ios/build/evidence-release.json
            python3 -c 'import json,os; assert json.load(open("ios/build/evidence-release.json"))["targetCommitish"] == os.environ["VALIDATED_SOURCE"]'
            gh release download "iphone-test-evidence-$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" --pattern iphone-test-evidence.zip --dir ios/build
            ditto -x -k ios/build/iphone-test-evidence.zip ios/build/reviewed-evidence
          fi
          if [[ -d ios/build/PendingUI.xcresult ]]; then
            xcrun xcresulttool export attachments --path ios/build/PendingUI.xcresult --output-path ios/build/reviewed-evidence/pending-ui
          fi
          cp ios/build/validation-proof.json ios/build/reviewed-evidence/validation-proof.json
          ditto -c -k --keepParent ios/build/reviewed-evidence ios/build/iphone-validation-evidence.zip
      - name: Build device without signing
        run: |
          set -euo pipefail
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build/DeviceData -clonedSourcePackagesDirPath ios/build/SourcePackages CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee ios/build/logs/device.log
      - name: Package and verify unsigned iPhone IPA
        run: python3 scripts/ios/package-ipa.py --app ios/build/DeviceData/Build/Products/Release-iphoneos/Harbor.app --output ios/build/Harbor-unsigned.ipa --commit "$VALIDATED_SOURCE"
      - name: Save verified unsigned IPA with its preserved validation
        if: inputs.save_draft_build == true
        run: |
          set -euo pipefail
          tag="iphone-unsigned-${VALIDATED_SOURCE:0:12}"
          gh release upload "$tag" ios/build/Harbor-unsigned.ipa ios/build/Harbor-unsigned.json ios/build/iphone-validation-evidence.zip --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" ios/build/validation-proof.json --repo "$GITHUB_REPOSITORY" --clobber
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('ios/build/validation-proof.json').read_text())
          assert proof['complete'] and not proof['pending_ui']
          counts = {result: sum(item['result'] == result for item in proof['approved_results'].values()) for result in ['passed', 'skipped']}
          notes = 'Unsigned iPhone build from exact application source ' + proof['application_source'] + '.\n\n'
          notes += 'The owner requested reuse of already approved tests. Native/public/UI evidence is preserved from completed runs of this exact source, rather than repeated by this packaging job.\n\n'
          notes += 'Unique approved methods: ' + str(counts) + '. Full provenance and reviewed external service failures are in validation-proof.json. This job builds and verifies the arm64 device IPA. Physical iPhone fluency remains unconfirmed.\n'
          Path('ios/build/reused-validation-notes.md').write_text(notes)
          PY
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file ios/build/reused-validation-notes.md
