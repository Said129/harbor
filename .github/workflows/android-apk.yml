name: Android APK spike

# Builds a debug APK of the Desktop app (Tauri) so its interface can be judged on a phone.
# Runs only on android/spike-* branches. The APK is a throwaway: no embedded mpv player, no tray, no floating windows.

on:
  push:
    branches: ["android/spike-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: debug APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Stand-ins the Tauri build script looks for
        run: |
          mkdir -p src-tauri/binaries
          for name in yt-dlp ffmpeg ffprobe; do : > "src-tauri/binaries/${name}-aarch64-linux-android"; done

      - name: Build the APK
        shell: bash
        env:
          VITE_HARBOR_PHONE: "1"
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          echo "ANDROID_HOME=$ANDROID_HOME NDK_HOME=$NDK_HOME JAVA_HOME=$JAVA_HOME"
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # OpenSSL is built from source for Android and its makefile looks for the NDK tools by name.
          export PATH="$BIN:$PATH"
          export ANDROID_NDK_ROOT="$NDK_HOME"
          export RANLIB="$BIN/llvm-ranlib"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          pnpm tauri android init --ci
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Collect the APK
        if: always()
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/gen/android -name '*.apk' -print -exec cp {} out/ \; || true
          ls -la out

      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-android-debug-apk
          path: out/*.apk
          if-no-files-found: warn
