name: iOS focused changes
on:
  workflow_call:
    inputs:
      selection:
        required: true
        type: string
      package:
        type: boolean
        default: false
      runtime_candidate:
        type: boolean
        default: false
      runner:
        type: string
        default: macos-15-intel
  workflow_dispatch:
    inputs:
      selection:
        description: Comma separated XCTest identifiers for changed behavior only
        required: true
        type: string
      package:
        description: Build the next requested interim IPA after the selected tests pass
        type: boolean
        default: false
      runtime_candidate:
        description: Validate the verified audio filter candidate without changing the default runtime
        type: boolean
        default: false
      runner:
        description: Apple build host; the native cache is keyed by its architecture
        type: choice
        options: [macos-15-intel, macos-15]
        default: macos-15-intel
permissions:
  contents: read
concurrency:
  group: ios-focused-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changed:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 350
    env:
      HARBOR_FOCUSED_SELECTION: ${{ inputs.selection }}
      INPUT_PACKAGE: ${{ inputs.package }}
      HARBOR_MUSIC_RUNTIME_CANDIDATE: ${{ inputs.runtime_candidate }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse changed native code
        run: python3 scripts/ios/parse-swift.py
      - name: Prepare the isolated simulator audio output
        run: python3 scripts/ios/prepare-ci-audio.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            harbor-core
            harbor-ios-bridge
      - uses: actions/cache/restore@v6
        id: spm
        with:
          path: ios/build/SourcePackages
          key: iphone-spm-${{ runner.os }}-${{ inputs.runtime_candidate }}-${{ hashFiles('ios/project.yml', 'ios/MPVKitMusic/Package.swift', 'ios/AudioRuntime/package-inputs.json') }}
          restore-keys: iphone-spm-${{ runner.os }}-
      - name: Identify the native compiler cache
        id: native-toolchain
        shell: bash
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: native-build
        with:
          path: |
            ios/build/DerivedData/Build/Intermediates.noindex
            ios/build/DerivedData/Build/Products
            ios/build/DerivedData/ModuleCache.noindex
          key: iphone-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.version }}-${{ github.sha }}
          restore-keys: iphone-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.version }}-
      - name: Build shared native library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/logs
          if [[ '${{ inputs.package }}' == 'true' ]]; then mode=--all; else mode=--simulator-only; fi
          bash scripts/ios/build-rust.sh "$mode" 2>&1 | tee ios/build/logs/rust.log
      - name: Check changed shared Rust host code
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD:harbor-ios-bridge)" == '69950e235d2c64dbd5817ca742d9eff48ff755d7' && "$(git rev-parse HEAD:harbor-core)" == '46951aae1f450e6013ca10958d9f7be0aaf311b7' ]]; then
            echo 'Reusing the accepted host cargo check from source 0f7deb9b, run 41496910543; both Rust trees unchanged.' | tee ios/build/logs/host-rust-check-reused.log
          else
            cargo check --locked --manifest-path harbor-ios-bridge/Cargo.toml 2>&1 | tee ios/build/logs/host-rust-check.log
          fi
      - name: Run the shared ranking tests (parser, trust, scoring, Debrid flags)
        if: ${{ contains(inputs.selection, 'DebridStreamTests') || contains(inputs.selection, 'StreamSourcePolicyTests') }}
        # The Rust core had no CI run since the Debrid and trust changes; a failing core test is
        # reported in the log without hiding the Swift results that follow.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path harbor-core/Cargo.toml --no-default-features 2>&1 | tee ios/build/logs/harbor-core-tests.log
      - name: Check changed music grammar and original recording matching
        if: ${{ contains(inputs.selection, 'MusicPlaylistImportTests') || contains(inputs.selection, 'SoundCloudMusicTests') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git hash-object harbor-core/src/music_m3u.rs)" == '7000db46fa22fc773018a719bf4f12bce0c30416' && "$(git hash-object harbor-core/src/music_matching.rs)" == '8096e10e776bb897db613c367aea2103a46e9c25' ]]; then
            echo 'Reusing 2 M3U and 15 original matching passes from source a65cdac9, run 41301181420.' | tee ios/build/logs/music-rust-reused.log
          else
            cargo test --locked --manifest-path harbor-core/Cargo.toml --no-default-features music_m3u::tests 2>&1 | tee ios/build/logs/music-m3u-tests.log
            cargo test --locked --manifest-path harbor-core/Cargo.toml --no-default-features music_matching::tests 2>&1 | tee ios/build/logs/music-matching-tests.log
          fi
      - name: Validate the ported original Jellyfin connector
        if: ${{ contains(inputs.selection, 'JellyfinMusicTests') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD:harbor-ios-bridge/src/music/connectors/jellyfin)" == '0f338bc5a8c3fdf473b47bb840ec871de86a61d5' ]]; then
            echo 'Reusing 26 original Jellyfin passes from source 3d66a954, run 41492339187; source tree unchanged.' | tee ios/build/logs/jellyfin-original-reused.log
          else
            cargo test --locked --manifest-path harbor-ios-bridge/Cargo.toml music::connectors::jellyfin:: 2>&1 | tee ios/build/logs/jellyfin-original-tests.log
          fi
      - name: Validate the ported original Plex connector
        if: ${{ contains(inputs.selection, 'PlexMusicTests') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD:harbor-ios-bridge/src/music/connectors/plex)" == '4816e1f3e17a31cb972b7010cf3a86d4ca0f0718' ]]; then
            echo 'Reusing 22 original Plex passes from source 0f7deb9b, run 41496910543; source tree unchanged.' | tee ios/build/logs/plex-original-reused.log
          else
            cargo test --locked --manifest-path harbor-ios-bridge/Cargo.toml music::connectors::plex:: 2>&1 | tee ios/build/logs/plex-original-tests.log
          fi
      - name: Prepare the native project
        run: |
          python3 scripts/ios/fetch-interface-font.py
          python3 scripts/ios/fetch-manga-font.py
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          spec=ios/project.yml
          if [[ '${{ inputs.runtime_candidate }}' == 'true' ]]; then
            python3 scripts/ios/prepare-music-runtime.py
            spec=ios/project.music-runtime.generated.yml
          fi
          xcodegen generate --spec "$spec"
          python3 scripts/ios/resolve-packages.py
      - name: Validate original audio processing math
        if: ${{ contains(inputs.selection, 'MusicAudioTests') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git hash-object harbor-core/src/music_audio.rs)" == "f2f3181955dc871ca7d40d4f44c42220978ac3cd" && "$(git hash-object harbor-core/src/music_audio_dsp.rs)" == "99beae38d861e7539854e157287c4b84f0a04957" && "$(git hash-object harbor-core/src/music_audio_fx.rs)" == "bf5bdfafcaa93b22acbf183161b480dfc07b3c6e" ]]; then
            echo "Reusing 13 original audio math passes from source 8a9c3be7, run 41449579804." | tee ios/build/logs/music-audio-reused.log
          else
            cargo test --locked --manifest-path harbor-core/Cargo.toml --no-default-features music_audio:: 2>&1 | tee ios/build/logs/music-audio-tests.log
          fi
      - name: Validate original movie hash arithmetic
        if: ${{ contains(inputs.selection, 'SubtitleMovieHashTests') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git hash-object harbor-core/src/subtitle_moviehash.rs)" == "755d77cda8897e767a95b490263a9ff75a01f36f" ]]; then
            echo "Reusing 2 original movie-hash arithmetic passes from source c2872e50, run 41480784667." | tee ios/build/logs/subtitle-moviehash-reused.log
          else
            cargo test --locked --manifest-path harbor-core/Cargo.toml --no-default-features subtitle_moviehash:: 2>&1 | tee ios/build/logs/subtitle-moviehash-tests.log
          fi
      - name: Build once and execute only the requested cases
        timeout-minutes: 80
        run: python3 scripts/ios/run-focused-changes.py
      - name: Preserve results before cache housekeeping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-results
          path: |
            ios/build/logs/
            ios/build/focused-results.json
            ios/build/FocusedTests.xcresult/
            ios/build/focused-attachments/
          retention-days: 7
          if-no-files-found: error
      - name: Package the requested interim IPA
        if: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Harbor.xcodeproj -scheme Harbor -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build/DeviceDerivedData -clonedSourcePackagesDirPath ios/build/SourcePackages CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/build/logs/device.log
          python3 scripts/ios/package-ipa.py --app ios/build/DeviceDerivedData/Build/Products/Release-iphoneos/Harbor.app --output ios/build/Harbor-unsigned.ipa --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.package }}
        with:
          name: iphone-unsigned-ipa
          path: |
            ios/build/Harbor-unsigned.ipa
            ios/build/Harbor-unsigned.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/cache/save@v6
        if: ${{ always() && steps.spm.outputs.cache-hit != 'true' }}
        with:
          path: ios/build/SourcePackages
          key: ${{ steps.spm.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: ${{ always() && steps.native-build.outputs.cache-primary-key != '' && steps.native-build.outputs.cache-hit != 'true' }}
        with:
          path: |
            ios/build/DerivedData/Build/Intermediates.noindex
            ios/build/DerivedData/Build/Products
            ios/build/DerivedData/ModuleCache.noindex
          key: ${{ steps.native-build.outputs.cache-primary-key }}
