name: Android spike

# A throwaway check: does the Desktop crate (src-tauri) get as far as compiling for Android, and which crates stop it.
# It runs only on android/spike-* branches and builds nothing that is shipped.

on:
  push:
    branches: ["android/spike-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: cargo check aarch64-linux-android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: Stand-ins the Tauri build script looks for
        run: |
          mkdir -p dist src-tauri/binaries
          echo '<!doctype html><title>spike</title>' > dist/index.html
          for name in yt-dlp ffmpeg ffprobe; do : > "src-tauri/binaries/${name}-aarch64-linux-android"; done

      - name: Check the Desktop crate for Android
        shell: bash
        run: |
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          echo "NDK: $NDK"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          # OpenSSL's own makefile looks for the NDK tools by name, so the NDK bin directory must be on PATH.
          export PATH="$BIN:$PATH"
          export ANDROID_NDK_ROOT="$NDK"
          export RANLIB="$BIN/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          cd src-tauri
          set +e
          cargo check --target aarch64-linux-android --keep-going --message-format short 2>&1 | tee ../android-check.log
          echo "cargo exit: ${PIPESTATUS[0]}"
          set -e
          echo "=== crates that failed ==="
          grep -E "failed to run custom build command|could not compile" ../android-check.log | sort -u || true
          echo "=== first errors ==="
          grep -E "^error|error(\[E[0-9]+\])?:" ../android-check.log | head -60 || true

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-log
          path: android-check.log
          if-no-files-found: warn
