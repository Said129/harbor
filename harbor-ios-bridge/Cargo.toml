[package]
name = "harbor-ios-bridge"
version = "0.1.0"
edition = "2021"
description = "Versioned native iPhone adapter for Harbor's shared Rust engine"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
harbor-core = { path = "../harbor-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
psl = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "native-tls-alpn",
  "http2",
  "stream",
  "gzip",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
wuff = "=0.2.9"

[profile.release]
lto = true
codegen-units = 1
