[package]
name = "harbor-ios-bridge"
version = "0.1.0"
edition = "2021"
description = "Versioned native iPhone adapter for Harbor's shared Rust engine"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
harbor-core = { path = "../harbor-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
lto = true
codegen-units = 1
